<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>猜词游戏 · 样品</title>
<style>
  /* ===== 浅色卡片风（2026-10-15 复核 C14）+ 2026-10-16 逐帧对齐原版 =====
     原版实证（v_start/z_tab2/z_live/z_over_top 帧）：
     - 白底圆角卡 + 浅灰页面底 + 蓝主色 #2b8cff
     - 榜单行 = 独立白色胶囊卡（行间留缝），非 hairline 分隔的平面列表
     - 昵称加粗黑色、段位徽章叠在昵称下方、分数蓝色带 % 号
     - 第 1 名行淡黄色底；实时猜词最新一条浅蓝底放大
     - 结算页段位行 = 徽章胶囊 + 彩色进度条（数字在条内）+ 金色 +奖励 */
  :root{
    --bg:#eef1f6; --panel:#ffffff; --lane:#f3f6fb; --row:#ffffff; --line:#dde3ec;
    --txt:#1f2430; --sub:#6b7688; --acc:#2b8cff; --gold:#e8a020; --ok:#18a058;
    --mut:#8a93a6; --hl:#fff7dd; --hlblue:#e5f0ff;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--txt);font:14px/1.5 "PingFang SC","Microsoft YaHei",sans-serif;
       min-height:100vh;display:flex;align-items:flex-start;justify-content:center;padding:20px 12px}
  .stage{width:740px;max-width:100%;display:flex;flex-direction:column;gap:10px}
  .card{background:var(--panel);border-radius:14px;box-shadow:0 4px 18px rgba(31,36,48,.07)}
  .ctitle{text-align:center;font-weight:800;font-size:14px;padding:2px 0 8px;letter-spacing:.5px}

  /* ---------- 顶部：左 分类/字数/难度 + 右 三条提示 ---------- */
  .topbar{display:flex;align-items:center;gap:14px;padding:14px 18px;flex-wrap:wrap}
  .meta{flex:1 1 220px;min-width:200px}
  .mline{display:flex;align-items:baseline;gap:4px;padding:2px 0}
  .mline .lab{color:var(--sub);font-size:13px}
  .mline b{font-size:15px;font-weight:800}
  .mline .sp{width:18px;display:inline-block}
  .hints{flex:1 1 240px;min-width:220px;display:flex;flex-direction:column;gap:2px}
  .hint{display:flex;align-items:baseline;gap:2px;font-size:13px}
  .hint .hk{color:var(--sub);flex:0 0 auto}
  .hint .hv{font-weight:700}
  .hint .he{color:var(--mut);font-weight:400;font-size:12px;margin:0 3px}
  .hint .hw{font-weight:800}
  .hint .hp{color:var(--acc);font-weight:700;font-size:12px}
  .hint.open .hv{color:var(--ok)}
  .hint.open .hw{color:var(--ok)}
  .tray{margin-left:auto;display:flex;align-items:center;gap:10px}
  .pill{background:var(--lane);border-radius:999px;padding:3px 12px;font-size:12px;color:var(--sub)}
  .pill b{color:var(--txt)}
  .timer{font-variant-numeric:tabular-nums;color:var(--gold);font-weight:800;font-size:18px}

  /* ---------- 主体两栏 ---------- */
  .main{display:grid;grid-template-columns:1.12fr 1fr;gap:10px}
  @media(max-width:680px){.main{grid-template-columns:1fr}}
  .side{display:flex;flex-direction:column;gap:10px}
  .lane{background:var(--lane);border-radius:12px;padding:8px}

  /* 榜单行 = 白色胶囊卡（原版 C1/A11） */
  .row{display:flex;align-items:center;gap:8px;background:var(--row);border-radius:11px;
       padding:7px 12px;margin-bottom:6px;font-size:13px;
       box-shadow:0 1px 3px rgba(31,36,48,.05);transition:transform .12s}
  .row:last-child{margin-bottom:0}
  .row:hover{transform:translateY(-1px)}
  .row.top1{background:var(--hl)}
  .rk{width:18px;text-align:center;color:var(--mut);font-size:12px;font-weight:700;flex:0 0 auto}
  .who{flex:1;display:flex;flex-direction:column;gap:2px;overflow:hidden;min-width:0}
  .nm{font-weight:700;color:var(--txt);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .wd{font-weight:800;letter-spacing:1px;flex:0 0 auto}
  .wd .oov{color:var(--mut);font-weight:400;font-size:10px}
  .sc{min-width:58px;text-align:right;font-variant-numeric:tabular-nums;color:var(--acc);
      font-weight:800;font-size:14px}
  .sc.win{color:var(--ok)}
  /* 头像（序18：昵称首字占位；接抖音后换真实头像） */
  .av{width:30px;height:30px;border-radius:50%;color:#fff;font-size:14px;font-weight:700;
      display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto;
      border:1.5px solid rgba(31,36,48,.12)}
  /* 段位徽章：白底彩色描边胶囊（原版 C8） */
  .tier-badge{font-size:10px;padding:0 6px;border-radius:5px;font-weight:700;white-space:nowrap;
              align-self:flex-start;line-height:1.5}

  /* ---------- 积分榜 ---------- */
  .tabs{display:flex;justify-content:center;gap:0;margin:0 auto 8px;background:#e9edf4;
        border-radius:999px;width:fit-content;padding:3px}
  .tabs b{cursor:pointer;padding:3px 26px;border-radius:999px;font-weight:700;font-size:13px;
          color:var(--sub);transition:.15s}
  .tabs b.on{background:var(--acc);color:#fff;box-shadow:0 2px 6px rgba(43,140,255,.35)}

  /* ---------- 上轮答案（原版 C3：无标题，居中两行） ---------- */
  .lastans{text-align:center;padding:12px 10px}
  .lastans .la1{font-size:14px;color:var(--sub)}
  .lastans .la1 b{color:var(--txt);font-weight:800;letter-spacing:1px}
  .lastans .la2{font-size:14px;font-weight:700;margin-top:2px}
  .lastans .la2.miss{color:#e5484d}
  .lastans .la2.hit{color:var(--ok)}

  /* ---------- 实时猜词（原版 C5：头像+词+分，最新浅蓝放大，时间序） ---------- */
  .dmlane{background:var(--lane);border-radius:12px;padding:8px;height:212px;overflow:hidden;
          display:flex;flex-direction:column;justify-content:flex-end;gap:6px}
  .dm{display:flex;align-items:center;gap:10px;background:var(--row);border-radius:11px;
      padding:7px 14px;font-size:15px;animation:dmin .3s ease-out;flex:0 0 auto;
      box-shadow:0 1px 3px rgba(31,36,48,.05)}
  @keyframes dmin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .dm .w{font-weight:800;letter-spacing:1px}
  .dm .s{margin-left:auto;font-variant-numeric:tabular-nums;color:var(--acc);font-weight:800}
  .dm.first{background:var(--hlblue);font-size:19px;padding:9px 14px}
  .dm.first .w{font-size:20px}
  .dm.first .s{font-size:17px}
  .dm.sys{background:none;box-shadow:none;color:var(--gold);font-size:12px;justify-content:center;
          padding:2px 0;opacity:.9}
  .dm.gift .w{color:#a64ee0}
  .dm.gift .s{color:#a64ee0}

  /* ---------- 玩法介绍（原版 C4：emoji + 粗体名 + 右侧灰字） ---------- */
  .howto{padding:4px 14px 10px}
  .howto .hr{display:flex;align-items:center;gap:8px;padding:4.5px 0;font-size:13px}
  .howto .hr .gn{font-weight:700}
  .howto .hr .gd{margin-left:auto;color:var(--sub)}

  /* ---------- 礼物按钮（样品演示用，原版直播无此区） ---------- */
  .gifts{display:flex;flex-wrap:wrap;gap:6px;padding:0 12px}
  .gifts .gbtn{background:var(--lane);border:1px solid var(--line);border-radius:9px;
               color:var(--txt);padding:6px 9px;font-size:12px;cursor:pointer;
               display:flex;flex-direction:column;align-items:center;gap:1px;line-height:1.25;
               position:relative;overflow:hidden;transition:.12s}
  .gifts .gbtn:hover{border-color:#a64ee0;transform:translateY(-1px)}
  .gifts .gbtn:active{transform:scale(.96)}
  .gifts .gbtn b{font-size:13px;font-weight:700}
  .gifts .gbtn span{font-size:10px;color:var(--sub)}
  .gifts .gbtn[disabled]{opacity:.45;cursor:wait}
  .gifts .gbtn i{position:absolute;top:0;right:0;font-style:normal;font-size:9px;
                 padding:0 4px;border-bottom-left-radius:7px;letter-spacing:.5px}
  .t-rubble i{background:#e6e9f0;color:#6b7280}
  .t-cheap  i{background:#dbe9fb;color:#1f6fd6}
  .t-fine   i{background:#d9f3e6;color:#0f9d58}
  .t-premium i{background:#fdeec9;color:#b8860b}
  .gifts .gbtn .prog{position:absolute;left:0;bottom:0;height:3px;background:#a64ee0;width:0}
  .giftjobs{padding:6px 12px 2px;font-size:11px;color:var(--sub);display:flex;
            flex-direction:column;gap:2px}
  .giftjobs div{display:flex;justify-content:space-between;gap:6px}
  .giftjobs b{color:#a64ee0;font-weight:700}
  .giftwrap{padding-bottom:10px}

  /* ---------- 输入区（样品演示用） ---------- */
  .foot{display:flex;gap:8px;padding:10px 14px;align-items:center}
  .foot input{background:var(--lane);border:1px solid var(--line);border-radius:10px;color:var(--txt);
              padding:9px 12px;outline:none;font-size:14px;transition:border-color .15s}
  .foot input:focus{border-color:var(--acc);background:#fff}
  #nick{width:104px}#word{flex:1}
  .btn{background:var(--acc);border:none;border-radius:10px;color:#fff;font-weight:700;
       padding:9px 16px;cursor:pointer;transition:.12s}
  .btn:hover{filter:brightness(1.06)}
  .btn.ghost{background:var(--lane);border:1px solid var(--line);color:var(--sub);font-weight:400}
  .btn:active{transform:scale(.97)}
  .hintbar{font-size:12px;color:var(--mut);padding:2px 6px 0;text-align:center}
  .hintbar code{background:#e6eaf2;border-radius:4px;padding:0 4px}

  .toast{position:fixed;left:50%;top:18px;transform:translateX(-50%);background:#ffffffee;border:1px solid var(--line);
         color:var(--txt);border-radius:10px;padding:8px 14px;font-size:13px;opacity:0;transition:.25s;
         pointer-events:none;z-index:9;box-shadow:0 6px 20px rgba(31,36,48,.15)}
  .toast.show{opacity:1}

  /* ---------- 结算浮层（原版 z_over_top 帧对齐） ---------- */
  .over{position:fixed;inset:0;background:rgba(238,241,246,.72);backdrop-filter:blur(3px);
        display:none;align-items:center;justify-content:center;z-index:20}
  .over.show{display:flex}
  .ov-card{background:var(--panel);border-radius:16px;padding:24px 26px 18px;text-align:center;
           min-width:380px;max-width:92vw;position:relative;overflow:hidden;
           box-shadow:0 16px 50px rgba(31,36,48,.18);animation:ovpop .35s cubic-bezier(.2,1.4,.4,1)}
  @keyframes ovpop{from{opacity:0;transform:scale(.88)}to{opacity:1;transform:scale(1)}}
  .ov-card .party{font-size:42px;line-height:1}
  .ov-card .congrats{font-size:17px;font-weight:800;margin-top:8px}
  .ov-card .congrats .win{color:#f28c28}
  .ov-card .ov-lab{font-size:12px;color:var(--mut);margin-top:6px}
  .ov-card .ov-ans{font-size:32px;font-weight:800;color:var(--gold);letter-spacing:4px;margin:2px 0 12px}
  .ov-list{background:var(--lane);border-radius:12px;padding:8px;text-align:left}
  .ov-row{background:var(--row);border-radius:10px;padding:8px 12px;margin-bottom:6px;
          box-shadow:0 1px 3px rgba(31,36,48,.05)}
  .ov-row:last-child{margin-bottom:0}
  .ov-line1{display:flex;align-items:center;gap:8px}
  .ov-line1 .nm{font-weight:700}
  .ov-line1 .wd{font-weight:800;letter-spacing:1px;margin-left:auto}
  .ov-line1 .sc{color:var(--acc);font-weight:800;font-variant-numeric:tabular-nums;min-width:52px;text-align:right}
  .ov-line2{display:flex;align-items:center;gap:6px;margin-top:6px}
  .tpb{position:relative;flex:1;height:16px;border-radius:8px;background:#e9edf4;overflow:hidden;min-width:56px}
  .tpb i{position:absolute;left:0;top:0;bottom:0;border-radius:8px;display:block}
  .tpb span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
            font-size:10px;font-weight:700;color:#fff;text-shadow:0 0 3px rgba(31,36,48,.5);
            font-variant-numeric:tabular-nums}
  .ov-line2 .arr{color:var(--mut);font-weight:700;flex:0 0 auto}
  .ov-line2 .rw{color:var(--gold);font-weight:800;font-size:15px;flex:0 0 auto;min-width:44px;text-align:right}
  .next-tip{margin-top:12px;font-size:12px;color:var(--mut);animation:pulse 1.6s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:.45}50%{opacity:1}}
  .confetti{position:absolute;top:-10px;width:8px;height:14px;opacity:.9;border-radius:2px;
            animation:fall linear forwards;pointer-events:none}
  @keyframes fall{to{transform:translateY(560px) rotate(720deg);opacity:0}}
</style>
</head>
<body>
<div class="stage">
  <!-- 顶部：左 分类/字数/难度，右 三条提示（原版 v_start 帧布局） -->
  <div class="card topbar">
    <div class="meta">
      <div class="mline"><span class="lab">分类：</span><b id="p-cat">🔒 计算中</b><span class="sp"></span><span class="lab">字数：</span><b id="p-len">—</b></div>
      <div class="mline"><span class="lab">难度：</span><b id="p-diff">—</b></div>
    </div>
    <div class="hints">
      <div class="hint locked" id="h-h1"><span class="hk">提示一：</span><span class="hv" id="i-h1">--</span></div>
      <div class="hint locked" id="h-h2"><span class="hk">提示二：</span><span class="hv" id="i-h2">--</span></div>
      <div class="hint locked" id="h-h3"><span class="hk">提示三：</span><span class="hv" id="i-h3">--</span></div>
    </div>
    <div class="tray">
      <span class="pill" id="p-like">❤️ <b>0</b></span>
      <span class="timer" id="p-timer">--:--</span>
    </div>
  </div>

  <div class="main">
    <!-- 左：本轮猜词排行榜 -->
    <div class="card" style="padding:10px 10px 12px">
      <div class="ctitle">🏆 本轮猜词排行榜 🏆</div>
      <div class="lane" id="rows-lane"><div id="rows"></div></div>
    </div>
    <!-- 右：积分榜 / 上轮答案 / 实时猜词 / 玩法介绍 / 礼物 -->
    <div class="side">
      <div class="card" style="padding:10px 10px 12px">
        <div class="ctitle">🏅 积分排行 🏅</div>
        <div class="tabs"><b id="tab-trend" class="on">趋势</b><b id="tab-tier">段位</b></div>
        <div class="lane"><div id="ranks"></div></div>
      </div>
      <div class="card lastans" id="lastans"><div class="la1" style="color:var(--mut)">—</div></div>
      <div class="card" style="padding:10px 10px 12px">
        <div class="ctitle">⚡ 实时猜词 ⚡</div>
        <div class="dmlane" id="dm-list"></div>
      </div>
      <div class="card" style="padding:10px 0 10px">
        <div class="ctitle">📖 玩法介绍 📖</div>
        <div class="howto" id="howto"><span style="color:var(--sub);font-size:12px;padding:0 14px">加载中…</span></div>
      </div>
      <div class="card giftwrap" style="padding-top:10px">
        <div class="ctitle">🎁 模拟礼物 · 付费代猜</div>
        <div class="gifts" id="gifts"><span style="color:var(--sub);font-size:12px">加载中…</span></div>
        <div class="giftjobs" id="gift-jobs"></div>
      </div>
    </div>
  </div>

  <div class="card foot">
    <input id="nick" placeholder="昵称" maxlength="16">
    <input id="word" placeholder="输入你猜的词，回车发送" maxlength="12">
    <button class="btn" id="send">发送</button>
    <button class="btn ghost" id="like">❤️ 赞</button>
    <button class="btn ghost" id="next">新局</button>
    <button class="btn ghost" id="bot">🤖 机器人：关</button>
  </div>
  <div class="hintbar">本地样品：输入任意中文词，按「语义相似度」给分（0–100%），先到 100% 者胜。
    分类 60 秒解锁，提示一/二/三 在 120/180/240 秒陆续给出；上抖音直播时弹幕经 <code>POST /danmaku</code> 喂入，玩法不变。</div>
</div>
<div class="toast" id="toast"></div>
<div class="over" id="over"><div class="ov-card" id="ov-card">
  <div class="party">🎉</div>
  <div class="congrats" id="ov-who"></div>
  <div class="ov-lab">目标词</div>
  <div class="ov-ans" id="ov-word"></div>
  <div class="ov-list" id="ov-list"></div>
  <div class="next-tip">新词即将出现…</div>
</div></div>

<script>
const $ = id => document.getElementById(id);
let nick = localStorage.getItem('guess_nick') || '';
$('nick').value = nick;
$('nick').oninput = e => { nick = e.target.value.trim(); localStorage.setItem('guess_nick', nick); };

function toast(t){ const el=$('toast'); el.textContent=t; el.classList.add('show'); clearTimeout(el._t); el._t=setTimeout(()=>el.classList.remove('show'),1800); }
function fmt(s){ return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0'); }
function pct(s){ return Number(s||0).toFixed(1)+'%'; }
function esc(s){ return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

async function post(url, body){
  const r = await fetch(url, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body||{})});
  return r.json();
}

/* 序18：头像圆（昵称首字 + 名字哈希配色；接抖音后换 <img> 真实头像） */
function avColor(name){
  let h = 0;
  for(const ch of String(name)) h = (h*31 + ch.codePointAt(0)) >>> 0;
  return `hsl(${h%360} 62% 52%)`;
}
function avatar(name){
  const n = String(name||'匿');
  let cp = [...n][0];
  return `<span class="av" style="background:${avColor(n)}">${esc(cp)}</span>`;
}

async function sendGuess(){
  const w = $('word').value.trim();
  if(!w) return;
  if(!nick){ toast('先填昵称'); $('nick').focus(); return; }
  const r = await post('/guess', {player:nick, word:w});
  if(!r.ok){ toast(r.reason || '无效'); return; }
  if(r.oov) toast(`「${w}」不在主词库，按字形估算 ≈${r.score} 分`);
  if(r.is_new) $('word').value = '';
  if(r.won) toast(`🎉 你猜中了！`);
  else if(!r.is_new) toast(`你已经猜过「${w}」了`);
  else if(r.score < 30) toast(`${w}：${pct(r.score)}（关系较远）`);
  refresh();
}

$('send').onclick = sendGuess;
$('word').addEventListener('keydown', e => { if(e.key === 'Enter') sendGuess(); });
$('like').onclick = async () => { await post('/like'); refresh(); };
$('next').onclick = async () => { await post('/newround'); refresh(); };
function syncBot(b){ if(!b) return; $('bot').textContent = '🤖 机器人：' + (b.on ? '开（'+esc(b.name)+'·'+b.sent+'发）' : '关'); }
$('bot').onclick = async () => {
  const on = !(JSON.parse(localStorage.getItem('guess_bot') || 'false'));
  localStorage.setItem('guess_bot', JSON.stringify(on));
  const r = await post('/bot', {on});
  syncBot(r); refresh();
};
if(JSON.parse(localStorage.getItem('guess_bot') || 'false')) post('/bot', {on:true});

/* ===== 段位（序9/11：徽章白底彩色描边；C8 专属色） ===== */
const TIER_ORDER = ["大师I","大师II","大师III","大师IV","大师V","大师VI","大师VII",
  "钻石I","钻石II","钻石III","钻石IV","钻石V","钻石VI",
  "白金I","白金II","白金III","白金IV",
  "黄金I","黄金II","黄金III","白银I","白银II","青铜I","黑铁"];
const TIER_COLORS = {"黑铁":"#888780","青铜I":"#CD7F32","白银I":"#9aa3b2","白银II":"#9aa3b2",
  "黄金I":"#EF9F27","黄金II":"#EF9F27","黄金III":"#EF9F27","白金I":"#58b368","白金II":"#58b368",
  "白金III":"#58b368","白金IV":"#58b368","钻石I":"#5b9be0","钻石II":"#5b9be0","钻石III":"#5b9be0",
  "钻石IV":"#5b9be0","钻石V":"#5b9be0","钻石VI":"#5b9be0","大师I":"#9d6ef5","大师II":"#9d6ef5",
  "大师III":"#9d6ef5","大师IV":"#9d6ef5","大师V":"#9d6ef5","大师VI":"#9d6ef5","大师VII":"#9d6ef5"};
function tierColor(t){ return TIER_COLORS[t] || '#888780'; }
function tierBadge(t){
  const c = tierColor(t);
  return `<b class="tier-badge" style="background:#fff;color:${c};border:1px solid ${c}">${esc(t)}</b>`;
}
/* 结算页段位行：徽章胶囊 + 彩色进度条（数字在条内） */
function tierPill(t){
  const c = tierColor(t.tier);
  return `<b class="tier-badge" style="background:#fff;color:${c};border:1px solid ${c};flex:0 0 auto">${esc(t.tier)}</b>`;
}
function tierBar(t){
  const c = tierColor(t.tier);
  const w = Math.max(4, Math.min(100, Math.round(t.prog/Math.max(1,t.cap)*100)));
  return `<span class="tpb"><i style="width:${w}%;background:${c}"></i><span>${t.prog}/${t.cap}</span></span>`;
}

/* ===== 实时猜词（序16 + C5：头像+词+分，3 条，最新浅蓝放大，时间序新在底） ===== */
const DM_MAX = 3;
let lastSeq = 0, lastRid = null, dmCount = 0, dmBusy = false;

function dmNode(it){
  const d = document.createElement('div');
  if(it.kind === 'system'){
    d.className = 'dm sys';
    d.textContent = it.text;
    return d;
  }
  d.className = 'dm' + ((it.player||'').startsWith('🎁') ? ' gift' : '');
  d.innerHTML = avatar(it.player) +
                `<span class="w">${esc(it.text)}</span>`+
                `<span class="s">${pct(it.score)}</span>`;
  return d;
}

async function pullFeed(){
  if(dmBusy) return;
  dmBusy = true;
  try{
    const r = await fetch('/feed?since='+lastSeq+'&limit=200');
    const j = await r.json();
    if(!j.items || !j.items.length){ lastSeq = Math.max(lastSeq, j.seq||0); return; }
    const list = $('dm-list');
    for(const it of j.items){ list.appendChild(dmNode(it)); dmCount++; }
    while(dmCount > DM_MAX && list.firstChild){ list.removeChild(list.firstChild); dmCount--; }
    list.querySelectorAll('.dm.first').forEach(x=>x.classList.remove('first'));
    const dns = list.querySelectorAll('.dm:not(.sys)');
    if(dns.length) dns[dns.length-1].classList.add('first');
    lastSeq = j.seq;
  }catch(e){ /* 网络抖动忽略，下轮继续 */ }
  finally{ dmBusy = false; }
}

/* ===== 积分榜（序10 双页签；原版 z_tab2：胶囊行、徽章叠昵称下、第1名淡黄底） ===== */
let rankTab = 'trend';
$('tab-trend').onclick = () => { rankTab='trend'; $('tab-trend').className='on'; $('tab-tier').className=''; renderRanks(lastScoreBoard); };
$('tab-tier').onclick  = () => { rankTab='tier';  $('tab-tier').className='on'; $('tab-trend').className=''; renderRanks(lastScoreBoard); };
let lastScoreBoard = [];

function renderRanks(board){
  if(!board || !board.length){ $('ranks').innerHTML = '<div class="row"><span class="nm" style="color:var(--mut)">暂无积分</span></div>'; return; }
  let rows;
  if(rankTab === 'tier'){
    rows = [...board].sort((a,b)=>{
      const ia = TIER_ORDER.indexOf(a.tier), ib = TIER_ORDER.indexOf(b.tier);
      return (ia<0?99:ia) - (ib<0?99:ib) || b.score - a.score;
    });
  } else {
    rows = board;
  }
  $('ranks').innerHTML = rows.map((x,i)=>
    `<div class="row${i===0?' top1':''}"><span class="rk">${i+1}</span>${avatar(x.player)}`+
    `<span class="who"><span class="nm">${esc(x.player)}</span>${tierBadge(x.tier)}</span>`+
    `<span class="sc">${x.score}</span></div>`
    ).join('');
}

/* ===== 提示区（原版 A6/A7/C13：锁定「28秒后 且 29/100赞」→ 仅赞数 → 「词 75.8%」） ===== */
const INTEL_KEYS = [['提示一','h-h1','i-h1'],['提示二','h-h2','i-h2'],['提示三','h-h3','i-h3']];
function renderHint(it, hid, vid){
  const el = $(vid), box = $(hid);
  if(it.ready){
    box.className = 'hint open';
    const m = String(it.value).match(/^(.+?)\s+([\d.]+)%$/);
    el.innerHTML = m ? `<span class="hw">${esc(m[1])}</span> <span class="hp">${m[2]}%</span>`
                     : `<span class="hw">${esc(it.value)}</span>`;
    return;
  }
  box.className = 'hint locked';
  if(it.remain != null){
    el.innerHTML = it.need_likes
      ? `${it.remain}秒后<span class="he">且</span>${it.likes}/${it.need_likes}赞`
      : `${it.remain}秒后`;
  } else if(it.need_likes){
    el.textContent = `${it.likes}/${it.need_likes}赞`;
  } else {
    el.textContent = '锁定中';
  }
}

async function refresh(){
  const st = await (await fetch('/state?viewer='+encodeURIComponent(nick))).json();
  if(lastRid !== null && st.rid !== lastRid){
    $('dm-list').innerHTML = ''; dmCount = 0; lastSeq = 0;
  }
  lastRid = st.rid;

  // 顶部 meta（原版：难度：困难（积分×2））
  $('p-cat').textContent = st.category ? st.category : '🔒 计算中';
  $('p-len').textContent = st.n_chars;
  const multS = String(st.mult).replace(/\.0$/,'');
  $('p-diff').textContent = `${st.difficulty}（积分×${multS}）`;
  $('p-like').innerHTML = '❤️ <b>'+st.likes+'</b>';
  $('p-timer').textContent = fmt(st.remain);

  for(const [k,hid,vid] of INTEL_KEYS) renderHint(st.intels[k] || {}, hid, vid);

  // 本轮榜：徽章叠昵称下方（用 score_board 的段位；新玩家默认黑铁）
  const tmap = {};
  (st.score_board||[]).forEach(x=>{ tmap[x.player]=x; });
  $('rows').innerHTML = st.board.map((e,i)=>{
    const t = (tmap[e.player]||{}).tier || '黑铁';
    return `<div class="row${i===0?' top1':''}"><span class="rk">${i+1}</span>${avatar(e.player)}`+
      `<span class="who"><span class="nm">${esc(e.player)}</span>${tierBadge(t)}</span>`+
      `<span class="wd">${esc(e.word)}${e.oov?' <small class="oov" title="词表外·字形估算">≈</small>':''}</span>`+
      `<span class="sc ${e.score>=100?'win':''}">${pct(e.score)}</span></div>`;
  }).join('') || '<div class="row"><span class="nm" style="color:var(--mut)">还没有人猜，抢沙发～</span></div>';

  lastScoreBoard = st.score_board || [];
  renderRanks(lastScoreBoard);

  // 上轮答案（原版 C3：居中两行，无人猜中红字）
  const last = (st.history || [])[st.history.length-1];
  $('lastans').innerHTML = last
    ? `<div class="la1">上轮答案：<b>${esc(last.answer)}</b></div>` +
      (last.winner ? `<div class="la2 hit">✔ ${esc(last.winner)} 猜中</div>`
                   : `<div class="la2 miss">无人猜中</div>`)
    : '<div class="la1" style="color:var(--mut)">—</div>';

  // 结算浮层（原版 z_over_top：恭喜+橙名 / 目标词 / 金答案 / 行内相似度分 + 段位条 + 金色+奖励）
  if(st.status !== 'running'){
    $('ov-who').innerHTML = st.winner
      ? `恭喜 <span class="win">${esc(st.winner)}</span> 猜中！`
      : '⏰ 本轮结束（无人猜中）';
    $('ov-word').textContent = st.answer;
    const top = st.settle_top && st.settle_top.length ? st.settle_top
              : (st.board||[]).slice(0,5).map(e=>({player:e.player,word:e.word,score:e.score}));
    $('ov-list').innerHTML = top.map((m,i)=>{
      const b = m.before, a = m.after;
      return `<div class="ov-row">`+
        `<div class="ov-line1"><span class="rk">${i+1}</span>${avatar(m.player)}`+
          `<span class="nm">${esc(m.player)}</span>`+
          `<span class="wd">${esc(m.word)}</span><span class="sc">${pct(m.score)}</span></div>`+
        (b && a
          ? `<div class="ov-line2">${tierPill(b)}${tierBar(b)}<span class="arr">→</span>`+
            `${tierPill(a)}${tierBar(a)}`+
            (m.reward!=null ? `<span class="rw">+${m.reward}</span>` : '')+
            `</div>`
          : '')+
      `</div>`;
    }).join('');
    confetti();
    $('over').classList.add('show');
    setTimeout(()=>{ $('over').classList.remove('show'); post('/newround'); }, 4200);
  }
}

function confetti(){
  const card = $('ov-card');
  card.querySelectorAll('.confetti').forEach(x=>x.remove());
  const colors = ['#ff5c8a','#ffd166','#3ddc97','#85B7EB','#f0a6ff','#7DDA58','#2b8cff'];
  for(let i=0;i<40;i++){
    const c = document.createElement('span');
    c.className = 'confetti';
    c.style.left = (Math.random()*100)+'%';
    c.style.background = colors[i % colors.length];
    c.style.animationDelay = (Math.random()*0.6)+'s';
    c.style.animationDuration = (1.6+Math.random()*1.2)+'s';
    card.appendChild(c);
    setTimeout(()=>c.remove(), 3600);
  }
}

/* 玩法介绍卡（序13：无价格；原版 C4：名粗体 + 右侧灰字词数） */
async function loadHowto(){
  try{
    const j = await (await fetch('/gifts')).json();
    $('howto').innerHTML = (j.gifts||[]).map(g=>
      `<div class="hr"><span class="gn">${esc(g.name)}</span><span class="gd">${esc(g.desc)}</span></div>`).join('');
  }catch(e){ $('howto').innerHTML = '<span style="color:#e5484d;font-size:12px;padding:0 14px">加载失败</span>'; }
}

/* ===== 模拟礼物按钮 ===== */
const GIFT_META = {};
async function loadGifts(){
  try{
    const j = await (await fetch('/gifts')).json();
    $('gifts').innerHTML = (j.gifts||[]).map(g=>{
      GIFT_META[g.key] = g;
      return `<button class="gbtn t-${esc(g.tier)}" data-k="${esc(g.key)}" `+
             `title="${esc(g.desc)}｜参考度 ${esc(g.tier_label)}｜近邻率 ${Math.round(g.near_ratio*100)}%">`+
             `<i>${esc(g.tier_label)}</i>`+
             `<b>${esc(g.name)}</b><span>${esc(g.desc)}</span>`+
             `<span class="prog"></span></button>`;
    }).join('');
    $('gifts').querySelectorAll('.gbtn').forEach(b=> b.onclick = () => sendGift(b));
  }catch(e){ $('gifts').innerHTML = '<span style="color:#e5484d;font-size:12px">礼物接口不可用</span>'; }
}

async function sendGift(btn){
  const key = btn.dataset.k;
  const r = await post('/gift/sim', {gift_key:key, sender: nick || '我', count:1});
  if(!r.ok){ toast(r.reason || '送礼失败'); return; }
  toast(`🎁 ${r.gift}（${r.tier_label}）：开始逐条刷 ${r.n_words} 个词`);
  syncJobs();
}

async function syncJobs(){
  try{
    const j = await (await fetch('/gift/jobs')).json();
    const act = j.active || [];
    const byGift = {};
    for(const a of act) byGift[a.gift_name] = a;
    document.querySelectorAll('#gifts .gbtn').forEach(b=>{
      const p = b.querySelector('.prog'); if(!p) return;
      const a = byGift[b.querySelector('b').textContent.trim()];
      p.style.width = a ? Math.round(a.sent/a.total*100)+'%' : '0';
    });
    $('gift-jobs').innerHTML = act.map(a=>
      `<div><span>🎁 ${esc(a.sender)} · ${esc(a.gift_name)}（${esc(a.tier_label)}）</span>`+
      `<b>${a.sent}/${a.total}</b></div>`).join('');
  }catch(e){}
}
setInterval(syncJobs, 700);

loadHowto();
loadGifts();
refresh(); setInterval(refresh, 1000);
setInterval(pullFeed, 500);
</script>
